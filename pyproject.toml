[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory"
version = "0.1.0"
description = "Reusable GitHub-native control plane for software agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-factory = "agent_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
