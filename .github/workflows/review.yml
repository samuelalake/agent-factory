name: reusable-agent-review

on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: number
      factory_ref:
        required: true
        type: string
    secrets:
      MODEL_API_KEY:
        required: true
      AGENT_FACTORY_APP_ID:
        required: true
      AGENT_FACTORY_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          path: consumer
      - name: Checkout factory
        uses: actions/checkout@v7
        with:
          repository: samuelalake/agent-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
      - name: Review current pull request
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          AGENT_FACTORY_APP_ID: ${{ secrets.AGENT_FACTORY_APP_ID }}
          AGENT_FACTORY_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_APP_PRIVATE_KEY }}
        run: >-
          python3 -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.8,<3' &&
          PYTHONPATH=factory/src python3 -m agent_factory.github_review
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr }}"
          --root consumer
          --config consumer/.agent-factory/config.json
