name: reusable-agent-review

on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: string
      factory_ref:
        required: true
        type: string
      validated_routing:
        required: false
        type: boolean
        default: false
      reviewer_app_id:
        required: false
        type: string
        default: ""
      steward_app_id:
        required: false
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      MINIMAX_API_KEY:
        required: false
      NVIDIA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      AGENT_FACTORY_APP_ID:
        required: false
      AGENT_FACTORY_APP_PRIVATE_KEY:
        required: false
      AGENT_FACTORY_REVIEWER_APP_ID:
        required: false
      AGENT_FACTORY_REVIEWER_APP_PRIVATE_KEY:
        required: false
      AGENT_FACTORY_STEWARD_APP_ID:
        required: true
      AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    concurrency:
      group: agent-factory-review-${{ github.repository }}-${{ inputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.validated_routing && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
          path: consumer
      - name: Checkout factory
        uses: actions/checkout@v7
        with:
          repository: samuelalake/agent-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
      - name: Detect Claude Code model route
        id: claude-code
        run: >-
          PYTHONPATH=factory/src python3 -c
          'import os; from pathlib import Path; from agent_factory.config import load_config;
          config = load_config(Path("consumer/.agent-factory/config.json"));
          routes = (config.review.provider, config.review.fallback_provider,
          config.steward.arbitration_provider, config.steward.arbitration_fallback_provider);
          enabled = "claude-code" in routes;
          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write(f"enabled={str(enabled).lower()}\n")'
      - name: Set up Node for Claude Code
        if: steps.claude-code.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        if: steps.claude-code.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.236
      - name: Review current pull request
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_FACTORY_APP_ID: ${{ inputs.reviewer_app_id || secrets.AGENT_FACTORY_REVIEWER_APP_ID || secrets.AGENT_FACTORY_APP_ID }}
          AGENT_FACTORY_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_REVIEWER_APP_PRIVATE_KEY || secrets.AGENT_FACTORY_APP_PRIVATE_KEY }}
        run: >-
          python3 -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.8,<3' &&
          PYTHONPATH=factory/src python3 -m agent_factory.github_review
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr }}"
          --root consumer
          --config consumer/.agent-factory/config.json
      - name: Mint Steward arbitration token
        id: steward-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.steward_app_id || secrets.AGENT_FACTORY_STEWARD_APP_ID }}
          private-key: ${{ secrets.AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      - name: Arbitrate exceptional evidence conflict
        id: arbitration
        env:
          GH_TOKEN: ${{ steps.steward-token.outputs.token }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          PYTHONPATH=factory/src python3 -m agent_factory.github_arbitration
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr }}"
          --root consumer
          --config consumer/.agent-factory/config.json
      - name: Review current pull request after Steward ruling
        if: steps.arbitration.outputs.arbitrated == 'true'
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_FACTORY_APP_ID: ${{ inputs.reviewer_app_id || secrets.AGENT_FACTORY_REVIEWER_APP_ID || secrets.AGENT_FACTORY_APP_ID }}
          AGENT_FACTORY_APP_PRIVATE_KEY: ${{ secrets.AGENT_FACTORY_REVIEWER_APP_PRIVATE_KEY || secrets.AGENT_FACTORY_APP_PRIVATE_KEY }}
        run: >-
          PYTHONPATH=factory/src python3 -m agent_factory.github_review
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr }}"
          --root consumer
          --config consumer/.agent-factory/config.json
