name: reusable-agent-builder

on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: string
      factory_ref:
        required: true
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-latest
      base_ref:
        required: false
        type: string
        default: main
      app_id:
        required: false
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      FIGMA_MCP_CLIENT_ID:
        required: false
      FIGMA_MCP_CLIENT_SECRET:
        required: false
      FIGMA_MCP_REFRESH_TOKEN:
        required: false
      GEMINI_API_KEY:
        required: false
      MINIMAX_API_KEY:
        required: false
      NVIDIA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      AGENT_FACTORY_BUILDER_APP_ID:
        required: false
      AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  builder:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    concurrency:
      group: agent-factory-builder-${{ github.repository }}-${{ inputs.issue }}
      cancel-in-progress: false
    steps:
      - name: Mint Builder installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id || secrets.AGENT_FACTORY_BUILDER_APP_ID }}
          private-key: ${{ secrets.AGENT_FACTORY_BUILDER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout consumer base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          path: consumer
          persist-credentials: false
      - name: Checkout factory
        uses: actions/checkout@v7
        with:
          repository: samuelalake/agent-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false
      - name: Read Builder harness configuration
        id: builder-config
        run: >-
          PYTHONPATH=factory/src python3 -c
          'import os; from pathlib import Path; from agent_factory.config import load_config;
          builder = load_config(Path("consumer/.agent-factory/config.json")).builder;
          enabled = builder.provider == "claude-code";
          output = (f"claude_code={str(enabled).lower()}\n"
          f"cli_version={builder.cli_version}\n"
          f"figma_mcp={str(builder.figma_mcp).lower()}\n");
          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write(output)'
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned Gemini CLI harness
        if: steps.builder-config.outputs.claude_code != 'true'
        run: npm install --global "@google/gemini-cli@${{ steps.builder-config.outputs.cli_version }}"
      - name: Install Claude Code CLI
        if: steps.builder-config.outputs.claude_code == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.236
      - name: Prepare short-lived Figma MCP access
        id: figma-prepare
        if: steps.builder-config.outputs.figma_mcp == 'true'
        env:
          FIGMA_MCP_CLIENT_ID: ${{ secrets.FIGMA_MCP_CLIENT_ID }}
          FIGMA_MCP_CLIENT_SECRET: ${{ secrets.FIGMA_MCP_CLIENT_SECRET }}
          FIGMA_MCP_REFRESH_TOKEN: ${{ secrets.FIGMA_MCP_REFRESH_TOKEN }}
        run: >-
          PYTHONPATH=factory/src python3 -m agent_factory.figma_mcp prepare
          --config "${{ runner.temp }}/agent-factory-figma-mcp.json"
          --github-env "${GITHUB_ENV}"
      - name: Build and publish pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AGENT_FACTORY_CI_READ_TOKEN: ${{ github.token }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          PYTHONPATH=factory/src python3 -m agent_factory.github_builder
          --repo "${{ github.repository }}"
          --issue "${{ inputs.issue }}"
          --root consumer
          --config consumer/.agent-factory/config.json
      - name: Invalidate Builder Figma access
        if: always() && steps.figma-prepare.outcome == 'success'
        env:
          FIGMA_MCP_CLIENT_ID: ${{ secrets.FIGMA_MCP_CLIENT_ID }}
          FIGMA_MCP_CLIENT_SECRET: ${{ secrets.FIGMA_MCP_CLIENT_SECRET }}
          FIGMA_MCP_REFRESH_TOKEN: ${{ secrets.FIGMA_MCP_REFRESH_TOKEN }}
        run: PYTHONPATH=factory/src python3 -m agent_factory.figma_mcp invalidate
