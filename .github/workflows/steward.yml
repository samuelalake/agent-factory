name: reusable-agent-steward

on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: string
      factory_ref:
        required: true
        type: string
      validated_routing:
        required: false
        type: boolean
        default: false
      base_ref:
        required: false
        type: string
        default: ""
      app_id:
        required: false
        type: string
        default: ""
    secrets:
      AGENT_FACTORY_STEWARD_APP_ID:
        required: false
      AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY:
        required: true
      MODEL_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      MINIMAX_API_KEY:
        required: false
      NVIDIA_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

jobs:
  route:
    if: inputs.validated_routing
    uses: ./.github/workflows/task-route.yml
    with:
      issue: ${{ inputs.issue }}
      base_ref: ${{ inputs.base_ref }}
      factory_ref: ${{ inputs.factory_ref }}
  steward:
    permissions:
      contents: read
    needs: route
    if: always() && (!inputs.validated_routing || needs.route.result == 'success')
    env:
      AGENT_FACTORY_TASK_ROUTE: ${{ needs.route.outputs.route }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-factory-steward-${{ github.repository }}-${{ inputs.issue }}
      cancel-in-progress: false
    steps:
      - name: Mint Steward installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id || secrets.AGENT_FACTORY_STEWARD_APP_ID }}
          private-key: ${{ secrets.AGENT_FACTORY_STEWARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.controller_sha || github.sha }}
          path: consumer
          persist-credentials: false
      - name: Checkout factory
        uses: actions/checkout@v7
        with:
          repository: samuelalake/agent-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false
      - name: Detect Claude Code Steward
        id: claude-code
        run: >-
          PYTHONPATH=factory/src python3 -c
          'import os; from pathlib import Path; from agent_factory.config import load_config;
          steward = load_config(Path("consumer/.agent-factory/config.json")).steward;
          enabled = steward.provider == "claude-code" or steward.fallback_provider == "claude-code";
          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write(f"enabled={str(enabled).lower()}\n")'
      - name: Set up Node for Claude Code
        if: steps.claude-code.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        if: steps.claude-code.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.236
      - name: Qualify and dispatch issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          PYTHONPATH=factory/src python3 -m agent_factory.github_steward
          --repo "${{ github.repository }}"
          --issue "${{ inputs.issue }}"
          --root consumer
          --config consumer/.agent-factory/config.json
