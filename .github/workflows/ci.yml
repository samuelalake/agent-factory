name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and syntax tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src tests
